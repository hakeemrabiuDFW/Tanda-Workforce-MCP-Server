name: checks
# Lint, typecheck, tests and build. Called by pr-pipeline.yml on every PR and by
# deploy.yml before each staging/production image build, so a deploy runs exactly
# the checks a PR passed. This file is the repo-specific part of the pipeline
# (it replaces ci.yml).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The MCP App view tests render the pages in headless Chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
