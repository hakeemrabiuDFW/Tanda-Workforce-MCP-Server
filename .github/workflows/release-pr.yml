name: Release PR

# Keeps one release pull request open from staging into main while staging has changes
# main doesn't. Merging it ships production; the next change to staging opens a new one,
# so each production release has its own PR listing exactly what it carries.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main staging
          if git merge-base --is-ancestor origin/staging origin/main; then
            echo "main already has everything on staging; nothing to release."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          {
            echo "## Release to production"
            echo "Merging ships \`staging\` to \`main\` and deploys production. Check staging first: https://tanda-mcp-stage-production.up.railway.app/health"
            echo
            echo "### Changes since the last release"
            gh pr list --base staging --state merged --limit 50 --json number,title,mergedAt \
              --jq ".[] | \"- #\\(.number) \\(.title)\"" > /tmp/merged.txt || true
            git log --merges --format='%s' origin/main..origin/staging \
              | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p' > /tmp/numbers.txt
            grep -E "^- #($(paste -sd'|' /tmp/numbers.txt)) " /tmp/merged.txt || git log --no-merges --format='- %s' origin/main..origin/staging
            echo
            echo "_Opened by the Release PR workflow; it updates this list on every push to staging._"
          } > /tmp/body.md
          existing=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release v$version (staging → main)" --body-file /tmp/body.md
            echo "Updated release PR #$existing"
          else
            gh pr create --base main --head staging --title "Release v$version (staging → main)" --body-file /tmp/body.md
          fi
