name: Image

# Builds a container image from a pinned commit and pushes it to GHCR, so
# Railway can deploy from an image when its own builders are unavailable.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build
        required: true
        default: dfe6b0a
  push:
    branches: [claude/new-session-gjdhu7]
    paths: [.github/workflows/image.yml]

env:
  REF: ${{ github.event.inputs.ref || 'dfe6b0a' }}
  IMAGE: ghcr.io/hakeemrabiudfw/tanda-workforce-mcp-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - id: meta
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=4.0.0
